    * { box-sizing: border-box; }

      background: var(--paper);
      color: var(--ink);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    header { padding: 22px 26px 12px; }
    h1 { margin: 0 0 5px; font-size: 25px; }
    .lead { margin: 0; color: var(--muted); }

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 26px 16px;
    }
    .switcher { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      border: 1px solid #aeb3b7;
      border-radius: 18px;
      background: var(--panel);
      color: var(--ink);
      padding: 6px 13px;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #71301e;
    }
    button:focus-visible, [tabindex="0"]:focus-visible {
      outline: 3px solid #d79078;
      outline-offset: 2px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-icon { display: block; width: 50px; height: 20px; flex: none; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      gap: 16px;
      padding: 0 18px 24px;
      align-items: start;
    }
    .map-scroll {
      overflow-x: auto;
      border: 1px solid #d7d9da;
      border-radius: 10px;
      background: var(--panel);
    }
    #map { display: block; width: 100%; min-width: 1040px; height: auto; }
    .layer-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .layer-caption { font-size: 11px; fill: var(--muted); text-anchor: middle; }
    .zone-caption { font-size: 12px; fill: var(--muted); }
    .column-guide { stroke: #eef0f1; stroke-width: 1; }
    .edge-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8;
      marker-end: url(#arrowhead);
      transition: opacity .15s, stroke .15s, stroke-width .15s;
    }
    .edge-line.dashed { stroke-dasharray: 8 6; }
    .edge-line.dotted { stroke-dasharray: 2 6; stroke-linecap: round; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
    .node { cursor: pointer; transition: opacity .15s; }
    .node rect, .legend-node rect {
      fill: #f1f2f2;
      stroke: #858b90;
      stroke-width: 1.2;
      rx: 7;
      transition: fill .15s, stroke .15s, stroke-width .15s;
    }
    .node text {
      fill: var(--ink);
      font: 14px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-anchor: middle;
      pointer-events: none;
    }
    .node .stream-mark { fill: var(--muted); font: 11px system-ui, sans-serif; }
    .is-filtered, .is-context-dim { opacity: .16; }
    .is-path:not(.is-filtered), .is-hover:not(.is-filtered) { opacity: 1; }
    .is-path .edge-line, .edge.is-path .edge-line {
      stroke: var(--accent); stroke-width: 2.8; marker-end: url(#arrowhead-active);
    }
    .node.is-path rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .node.is-hover rect { fill: #faefeb; stroke: #d79078; }
    .edge.is-hover .edge-line { stroke: #d79078; stroke-width: 2.2; }
    .node.is-selected rect { stroke-width: 3; }
    .edge.is-selected .edge-line { stroke-width: 4; }
    aside {
      min-height: 470px; max-height: calc(100vh - 32px); overflow-y: auto; position: sticky; top: 16px;
      padding: 20px;
      border: 1px solid #d7d9da;
      border-radius: 10px;
      background: var(--panel);
    }
    @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } aside { min-height: 0; max-height: none; position: static; } .map-scroll { max-height: 50vh; overflow: auto; } }
    aside h2 { margin: 0 0 3px; font-size: 20px; overflow-wrap: anywhere; }
    .meta { margin: 0 0 18px; color: var(--muted); }
    .card-section { margin-top: 17px; }
    .card-section h3 { margin: 0 0 5px; font-size: 13px; }
    .card-section p { margin: 0; }
    .card-section ul { margin: 5px 0 0; padding-left: 20px; }
    .card-section li + li { margin-top: 5px; }
    code { font: .92em ui-monospace, SFMono-Regular, Consolas, monospace; }
    a { color: #8a351e; text-underline-offset: 2px; }
    .hint { color: var(--muted); font-size: 13px; }
    .edge[hidden] { display: none; }
    .node.student rect, .legend-node.student rect { stroke-dasharray: 5 3; }
    .node.student .stream-mark { fill: #875a14; }
    .edge.expected .edge-line, .legend-arrow.expected .edge-line { stroke-dasharray: 5 4; }
    .node.is-upstream rect, .legend-node.is-upstream rect { fill: #e3eff5; stroke: #307c9a; }
    .node.is-downstream rect, .legend-node.is-downstream rect { fill: #e7f1e5; stroke: #527a43; }
    .node.is-selected rect, .legend-node.is-selected rect { fill: var(--accent-soft); stroke: var(--accent); }
    .relation-button { border-radius: 5px; padding: 5px 7px; text-align: left; width: 100%; margin-top: 5px; font-size: 13px; }
    .badge { font-size: 13px; padding: 3px 8px; border-radius: 4px; background: #eef1ed; display: inline-block; }
    .badge.student { background: #fff1cf; color: #775018; }
    .navigation { margin: 8px 0; }
    code { overflow-wrap: anywhere; }
    summary { cursor: pointer; font-weight: 600; }

    noscript { display: block; padding: 20px; }
